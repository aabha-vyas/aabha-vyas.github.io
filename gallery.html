<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | Aabha Vyas</title>
<meta name="description" content="Travel photos by Aabha Vyas.">
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <a href="index.html">home</a>
  <a href="projects.html">projects</a>
  <a href="gallery.html" aria-current="page">gallery</a>
</nav>
<main class="wide">
  <div class="page-head"><h1>gallery</h1><p class="sub">travel photos.</p></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">photos coming soon.</p>
  <footer>&copy; 2026 Aabha Vyas</footer>
</main>
<div id="lightbox"><img alt=""><p></p></div>
<script>
  // Add your photos here. Put the image files in assets/gallery/ (about 1600px wide keeps pages fast).
  // Example: { src: 'assets/gallery/lisbon.jpg', place: 'Lisbon', year: '2025' }
  var photos = [
    { src: 'assets/gallery/img_4255.jpg', place: 'Barcelona', year: '2024' },
    { src: 'assets/gallery/img_4290.jpg', place: 'Barcelona', year: '2024' },
    { src: 'assets/gallery/img_7870.jpg', place: 'Colorado', year: '2025' },
    { src: 'assets/gallery/img_3994.jpg', place: 'Banff', year: '2025' },
    { src: 'assets/gallery/r0002987.jpg', place: 'Banff', year: '2025' },
    { src: 'assets/gallery/r0003056.jpg', place: 'Banff', year: '2025' },
    { src: 'assets/gallery/r0003095.jpg', place: 'Banff', year: '2025' },
    { src: 'assets/gallery/r0003560.jpg', place: 'Banff', year: '2025' },
    { src: 'assets/gallery/r0003646.jpg', place: 'Miami', year: '2025' },
    { src: 'assets/gallery/r0003661.jpg', place: 'Miami', year: '2025' },
    { src: 'assets/gallery/r0003696.jpg', place: 'Miami', year: '2025' },
    { src: 'assets/gallery/r0005207.jpg', place: 'Copenhagen', year: '2026' },
    { src: 'assets/gallery/r0005241.jpg', place: 'Budapest', year: '2026' },
    { src: 'assets/gallery/r0005331.jpg', place: 'Budapest', year: '2026' },
    { src: 'assets/gallery/r0005426.jpg', place: 'Salzburg', year: '2026' },
    { src: 'assets/gallery/r0005495.jpg', place: 'Hallstatt', year: '2026' },
    { src: 'assets/gallery/r0005518.jpg', place: 'Hallstatt', year: '2026' },
    { src: 'assets/gallery/r0005652.jpg', place: 'Werfen Ice Cave', year: '2026' }
  ];

  var grid = document.getElementById('grid');
  var box = document.getElementById('lightbox');
  document.getElementById('empty').style.display = photos.length ? 'none' : 'block';
  photos.forEach(function (p) {
    var fig = document.createElement('figure');
    var img = document.createElement('img');
    img.src = p.src; img.alt = p.place; img.loading = 'lazy';
    var cap = document.createElement('figcaption');
    cap.textContent = p.place + ', ' + p.year;
    fig.appendChild(img); fig.appendChild(cap);
    fig.addEventListener('click', function () {
      box.querySelector('img').src = p.src;
      box.querySelector('img').alt = p.place;
      box.querySelector('p').textContent = p.place + ', ' + p.year;
      box.classList.add('open');
    });
    grid.appendChild(fig);
  });
  box.addEventListener('click', function () { box.classList.remove('open'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') box.classList.remove('open'); });
</script>
</body>
</html>
