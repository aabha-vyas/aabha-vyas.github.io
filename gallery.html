<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | Aabha Vyas</title>
<meta name="description" content="Travel photos by Aabha Vyas.">
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <a href="index.html">home</a>
  <a href="projects.html">projects</a>
  <a href="gallery.html" aria-current="page">gallery</a>
  <button id="themeBtn" aria-label="Toggle light and dark mode"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
</nav>
<main class="wide">
  <div class="page-head"><h1>gallery</h1><p class="sub">travel photos.</p></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty">photos coming soon.</p>
  <footer>&copy; 2026 Aabha Vyas</footer>
</main>
<div id="lightbox"><img alt=""><p></p></div>
<script>
  // Add your photos here. Put the image files in assets/gallery/ (about 1600px wide keeps pages fast).
  // Example: { src: 'assets/gallery/lisbon.jpg', place: 'Lisbon', year: '2025' }
  var photos = [
  ];

  var grid = document.getElementById('grid');
  var box = document.getElementById('lightbox');
  document.getElementById('empty').style.display = photos.length ? 'none' : 'block';
  photos.forEach(function (p) {
    var fig = document.createElement('figure');
    var img = document.createElement('img');
    img.src = p.src; img.alt = p.place; img.loading = 'lazy';
    var cap = document.createElement('figcaption');
    cap.textContent = p.place + ', ' + p.year;
    fig.appendChild(img); fig.appendChild(cap);
    fig.addEventListener('click', function () {
      box.querySelector('img').src = p.src;
      box.querySelector('img').alt = p.place;
      box.querySelector('p').textContent = p.place + ', ' + p.year;
      box.classList.add('open');
    });
    grid.appendChild(fig);
  });
  box.addEventListener('click', function () { box.classList.remove('open'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') box.classList.remove('open'); });
</script>
</body>
</html>
